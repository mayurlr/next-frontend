name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test -- --watchAll=false
        env:
          CI: true

      - name: Build app
        run: npm run build
        env:
          CI: true

  docker-build:
    name: Docker Build
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image from Dockerfile
        run: docker build -t react-frontend:ci .

      - name: Smoke test the container
        run: |
          docker run -d --name app -p 8080:80 react-frontend:ci
          sleep 5
          curl --fail --silent http://localhost:8080 > /dev/null
          docker rm -f app